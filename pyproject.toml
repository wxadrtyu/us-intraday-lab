[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "us-intraday-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.3,<2",
  "exchange-calendars>=4.11,<5",
  "jinja2>=3.1,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=20,<22",
  "pydantic>=2.11,<3",
  "scipy>=1.15,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
intraday-lab = "us_intraday_lab.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["us_intraday_lab"]
